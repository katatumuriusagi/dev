name: Build KHI Code Reading Report

on:
  pull_request:
    paths:
      - "artifacts/khi_code_reading_report_20260807/khi_roi_patchcore_code_reading_report.tex"
      - "artifacts/khi_code_reading_report_20260807/BUILD_TRIGGER*.txt"
      - ".github/workflows/build-khi-code-reading-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX and renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-luatex texlive-lang-japanese texlive-latex-extra texlive-pictures texlive-science latexmk poppler-utils fonts-noto-cjk

      - name: Normalize LuaLaTeX source
        working-directory: artifacts/khi_code_reading_report_20260807
        run: |
          sed -i 's/{1zw}/{1em}/g' khi_roi_patchcore_code_reading_report.tex
          sed -i 's/self\._hook/self\\_hook/g' khi_roi_patchcore_code_reading_report.tex
          sed -i 's/{L{44mm} Y}/{L{75mm} Y}/g' khi_roi_patchcore_code_reading_report.tex
          sed -i 's/\\begin{tikzpicture}\[node distance=8mm\]/\\begin{tikzpicture}[node distance=5mm,scale=0.82,transform shape]/g' khi_roi_patchcore_code_reading_report.tex
          sed -i 's/\\begin{tikzpicture}\[node distance=10mm\]/\\begin{tikzpicture}[node distance=5mm,scale=0.72,transform shape]/g' khi_roi_patchcore_code_reading_report.tex

      - name: Compile LuaLaTeX
        working-directory: artifacts/khi_code_reading_report_20260807
        run: |
          latexmk -lualatex -interaction=nonstopmode -halt-on-error khi_roi_patchcore_code_reading_report.tex
          pdfinfo khi_roi_patchcore_code_reading_report.pdf

      - name: Render pages for QA
        working-directory: artifacts/khi_code_reading_report_20260807
        run: |
          mkdir -p preview
          pdftoppm -png -r 120 khi_roi_patchcore_code_reading_report.pdf preview/page

      - name: Package deliverables
        run: |
          cd artifacts
          zip -r khi_code_reading_report_20260807.zip khi_code_reading_report_20260807/khi_roi_patchcore_code_reading_report.pdf khi_code_reading_report_20260807/khi_roi_patchcore_code_reading_report.tex khi_code_reading_report_20260807/preview

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: khi-code-reading-report
          path: artifacts/khi_code_reading_report_20260807.zip

      - name: Publish compiled PDF and compilable TeX to PR branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          cp artifacts/khi_code_reading_report_20260807/khi_roi_patchcore_code_reading_report.pdf /tmp/khi_report.pdf
          cp artifacts/khi_code_reading_report_20260807/khi_roi_patchcore_code_reading_report.tex /tmp/khi_report_compilable.tex
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          cp /tmp/khi_report.pdf artifacts/khi_code_reading_report_20260807/khi_roi_patchcore_code_reading_report.pdf
          cp /tmp/khi_report_compilable.tex artifacts/khi_code_reading_report_20260807/khi_roi_patchcore_code_reading_report_compilable.tex
          git add -f artifacts/khi_code_reading_report_20260807/khi_roi_patchcore_code_reading_report.pdf artifacts/khi_code_reading_report_20260807/khi_roi_patchcore_code_reading_report_compilable.tex
          git commit -m "Add compiled code reading report [skip ci]" || exit 0
          git push origin "$HEAD_REF"
